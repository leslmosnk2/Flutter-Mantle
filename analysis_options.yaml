include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    unnecessary_overrides: ignore
    unnecessary_unawaited: ignore
    unnecessary_import: ignore
  exclude:
    - "**/*.g.dart"
    - build/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true # relaxed to false in packages/mantle_basic/example

