name: mantle

scripts:
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 5
  test:
    run: flutter test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
  gen:
    description: Run build_runner in all packages that use codegen.
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1
    packageFilters:
      dependsOn: mantle_gen
  format:
    run: dart format --set-exit-if-changed .
  new:component:
    description: Scaffold a new component from the mason brick.
    run: mason make mantle_component -o packages/mantle_widgets/lib/src/components