name: mantle_widgets
description: >
  Component contracts and generated widgets for Mantle. Pair with
  mantle_basic or register your own theme delegates.
version: 1.0.0
resolution: workspace

homepage: https://mantle.leslmosnk.com
repository: https://github.com/leslmosnk2/Flutter-Mantle/tree/main/packages/mantle_widgets
issue_tracker: https://github.com/leslmosnk2/Flutter-Mantle/issues
documentation: https://docs.mantle.leslmosnk.com/#/widgets/

topics:
  - flutter
  - widgets
  - design-system
  - ui
  - theme

environment:
  sdk: ^3.12.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  mantle_annotations: ^1.0.0
  mantle_core: ^1.0.0

dev_dependencies:
  build_runner: ^2.15.0
  mantle_gen: ^1.0.0
