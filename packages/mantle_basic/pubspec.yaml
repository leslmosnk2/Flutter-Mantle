name: mantle_basic
description: >
  Baseline Mantine-like theme for Mantle, with tokens and a delegate
  for every mantle_widgets contract.
version: 1.0.0
resolution: workspace

homepage: https://mantle.leslmosnk.com
repository: https://github.com/leslmosnk2/Flutter-Mantle/tree/main/packages/mantle_basic
issue_tracker: https://github.com/leslmosnk2/Flutter-Mantle/issues
documentation: https://docs.mantle.leslmosnk.com/#/basic/

topics:
  - flutter
  - theme
  - design-system
  - widgets
  - ui

environment:
  sdk: ^3.12.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  mantle_core: ^1.0.0
  mantle_widgets: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
