name: mantle_gen
description: >
  build_runner generators for Mantle. Annotate token groups and
  components, then emit helpers with SharedPartBuilder.
version: 1.0.0
resolution: workspace

homepage: https://mantle.leslmosnk.com
repository: https://github.com/leslmosnk2/Flutter-Mantle/tree/main/packages/mantle_gen
issue_tracker: https://github.com/leslmosnk2/Flutter-Mantle/issues
documentation: https://docs.mantle.leslmosnk.com/#/gen/

topics:
  - codegen
  - build-runner
  - design-system
  - theme
  - flutter

environment:
  sdk: ^3.12.0

dependencies:
  # Cap below versions that require meta ^1.18.3 (Flutter 3.44 pins meta 1.18.0).
  analyzer: ">=8.1.1 <13.1.0"
  build: ">=4.0.0 <4.0.8"
  mantle_annotations: ^1.0.0
  source_gen: ^4.2.4

dev_dependencies:
  build_runner: ">=2.15.0 <2.15.2"
  test: ^1.25.0
